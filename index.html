<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tom Godin</title>
<style>
  :root {
    --navy: #012169;
    --royal: #00539B;
    --graphite: #666666;
    --limestone: #E5E5E5;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background: #ffffff;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
    color: var(--navy);
  }
  main {
    text-align: center;
    padding: 2rem;
  }
  h1 {
    margin: 0 0 0.75rem;
    font-size: clamp(2rem, 6vw, 3.25rem);
    font-weight: 600;
    letter-spacing: 0.04em;
  }
  .rule {
    width: 48px;
    height: 3px;
    background: var(--royal);
    margin: 0 auto 1.25rem;
    border-radius: 2px;
  }
  p {
    margin: 0;
    font-size: 1.1rem;
    font-weight: 400;
    color: var(--graphite);
    letter-spacing: 0.02em;
  }
  footer {
    position: fixed;
    bottom: 1.5rem;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 0.8rem;
    color: var(--limestone);
  }
</style>
</head>
<body>
  <main>
    <h1>TOM GODIN</h1>
    <div class="rule"></div>
    <p>Coming soon.</p>
  </main>
</body>
</html>
